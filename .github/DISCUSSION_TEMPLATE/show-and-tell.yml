title: "[Setup]: "
body:
  - type: markdown
    attributes:
      value: |
        Show off a setup that works: your TV, how you log in, and anything that helped.  It helps the next person who gets stuck.
  - type: input
    id: tv
    attributes:
      label: TV model and webOS version
      description: For example "OLED65C2PUA, webOS 25".
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: What you log in from
      description: For example "VS Code Remote SSH on a Mac", "WinSCP", "Termius".
  - type: textarea
    id: story
    attributes:
      label: Your setup
      description: Settings you use (port, keys only, keepalive), what you do over SSH, screenshots.
    validations:
      required: true
